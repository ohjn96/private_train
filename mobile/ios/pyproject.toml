# iPhone 앱 (BeeWare Briefcase + Toga). 자세한 건 README.md.
#
# 빌드 전에 꼭:
#   python sync_sources.py                 # webui/ core/ korail2/ mobile_runtime.py 를 src/ 로 복사 + 버전 맞춤
#   python tools/make_pure_markupsafe.py   # iOS 용 순수 파이썬 wheel (MarkupSafe, pyaes) → wheels/
#
# 확인한 버전: briefcase 0.4.4 / toga-iOS 0.5.6 / Python 3.12 (support package b9, 최소 iOS 13.0)

[tool.briefcase]
project_name = "TrainReservation"
bundle = "com.ohjn96"
# sync_sources.py 가 저장소의 VERSION 파일 값으로 덮어쓴다 (직접 고치지 않아도 됨)
version = "2.3.3"
author = "ohjn96"

[tool.briefcase.app.trainreservation]
# formal_name 은 Xcode 프로젝트·타깃·실행 파일 이름이 된다. 한글이면 Xcode/파일시스템(NFC·NFD)에서
# 문제가 날 수 있어 ASCII 로 두고, 홈 화면 이름(CFBundleDisplayName)은
# tools/prepare_xcode_project.py 가 "열차예약" 으로 바꾼다. 앱 안의 표시 이름은 app.py 에서 지정.
formal_name = "TrainReservation"
description = "코레일 열차 좌석 예약 도우미 (폰 안에서 도는 웹 화면)"
long_description = "공통 웹 화면(webui)과 예약 로직(core)을 폰 안 127.0.0.1 에 띄워 WebView 로 보여준다."
# 개인 사용 라이선스 (저장소 루트 LICENSE). SPDX 에 없는 라이선스라 LicenseRef.
license = "LicenseRef-Personal-Use"
license-files = ["../../LICENSE"]
# src/ 아래 trainreservation 말고는 sync_sources.py 가 복사해 온다 (git 에 없음)
sources = [
    "src/trainreservation",
    "src/webui",
    "src/core",
    "src/korail2",
    "src/mobile_runtime.py",
]
# requirements.txt 와 같은 버전. C 확장은 iOS wheel 이 없어서:
# - pycryptodome 은 뺀다 → korail2/_aes.py 가 순수 파이썬 pyaes 로 대신한다
# - MarkupSafe·pyaes 는 wheels/ 의 순수 파이썬 wheel 을 쓴다 (tools/make_pure_markupsafe.py)
requires = [
    "Flask==3.1.0",
    "Werkzeug==3.1.3",
    "Jinja2==3.1.5",
    "MarkupSafe==3.0.2",
    "itsdangerous==2.2.0",
    "blinker==1.9.0",
    "click==8.1.8",
    "requests==2.32.3",
    "urllib3==2.2.3",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "idna==3.8",
    "pyaes==1.6.1",
]

[tool.briefcase.app.trainreservation.iOS]
# 앱 아이콘: icons/trainreservation-<크기>.png (20~1024 은 AppIcon, 640·1280·1920 은 시작 화면).
# 원본은 mobile/shared/icon/app-icon.svg (README.md 참고)
icon = "icons/trainreservation"
requires = [
    "toga-iOS==0.5.6",
    "std-nslog~=1.0.3",
]
# Briefcase 가 "./" 로 시작하는 경로를 절대 경로로 바꿔 pip 에 넘긴다
requirement_installer_args = ["--find-links", "./wheels"]

# Info.plist 에 들어간다. WebView 가 http://127.0.0.1 (폰 안 서버)을 열 수 있게.
[tool.briefcase.app.trainreservation.iOS.info]
NSAppTransportSecurity = { NSAllowsLocalNetworking = true }
