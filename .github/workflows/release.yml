name: Build Desktop Apps

# v 태그를 푸시하면 Windows / macOS 러너에서 실행 파일을 빌드해 Release 에 첨부합니다.
#   git tag v2.0.1 && git push origin v2.0.1
# 수동 실행(Actions 탭 > Run workflow)도 가능하며, 이때는 Release 없이 아티팩트만 남습니다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Release 생성/업로드에 필요

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      # Windows 콘솔 기본 인코딩(cp949/cp1252)에서 한글·이모지 출력이 죽지 않도록
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: VERSION 과 태그 일치 확인
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $version) {
              throw "태그($tag) 와 VERSION 파일($version) 이 다릅니다. VERSION 을 먼저 올려주세요."
            }
          }

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: 빌드
        run: python build/build.py unified

      - name: 실행 스모크 테스트 (exe 가 실제로 뜨는지)
        shell: pwsh
        env:
          NO_BROWSER: '1'   # 러너에서 브라우저 띄우지 않기
        run: |
          $exe = ".\TrainReservationApp-v$env:VERSION.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $res = Invoke-WebRequest http://localhost:5050/login -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "exe 가 60초 안에 응답하지 않았습니다." }
          Write-Host "OK: exe 정상 기동 확인"

      - name: 아티팩트 업로드 (수동 실행용)
        uses: actions/upload-artifact@v7
        with:
          name: TrainReservationApp-v${{ env.VERSION }}
          path: TrainReservationApp-v${{ env.VERSION }}.exe

      - name: Release 에 첨부 (태그 푸시일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: TrainReservationApp-v${{ env.VERSION }}.exe
          generate_release_notes: true

  build-macos:
    # Apple Silicon 전용. 2020년 M1 이후 Mac 은 전부 arm64 이고, Intel 러너
    # (macos-13) 는 은퇴해서 큐에서 배정되지 않는다.
    # PyInstaller 는 크로스 컴파일이 안 되므로 러너 아키텍처 = 산출물 아키텍처.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: VERSION 과 태그 일치 확인
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "태그($tag) 와 VERSION 파일($version) 이 다릅니다. VERSION 을 먼저 올려주세요." >&2
              exit 1
            fi
          fi

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 빌드
        run: python build/build.py unified

      - name: 실행 스모크 테스트 (바이너리가 실제로 뜨는지)
        env:
          NO_BROWSER: '1'   # 러너에서 브라우저 띄우지 않기
        run: |
          app="./TrainReservationApp-v$VERSION"
          chmod +x "$app"
          "$app" &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            sleep 2
            if curl -fsS -m 5 http://localhost:5050/login > /dev/null; then ok=1; break; fi
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "바이너리가 60초 안에 응답하지 않았습니다." >&2
            exit 1
          fi
          echo "OK: 바이너리 정상 기동 확인"

      - name: 아카이브 (더블클릭 런처 동봉)
        run: |
          name="TrainReservationApp-v$VERSION-macos-arm64"
          mkdir -p "$name"
          mv "TrainReservationApp-v$VERSION" "$name/$name"
          chmod +x "$name/$name"

          # 터미널을 못 쓰는 사용자를 위한 더블클릭 런처.
          # Gatekeeper 격리 속성(브라우저 다운로드 시 붙음)을 떼고 본체를 실행한다.
          cat > "$name/실행.command" <<'LAUNCHER'
          #!/bin/bash
          cd "$(dirname "$0")" || exit 1
          echo "🚄 잠시만요, 처음 실행이라면 macOS 보안 확인이 뜰 수 있습니다."
          xattr -dr com.apple.quarantine . 2>/dev/null || true
          app=$(ls TrainReservationApp-*-macos-arm64 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "실행 파일을 찾지 못했습니다. 압축을 푼 폴더 안에서 실행해 주세요." >&2
            read -r -p "엔터를 누르면 닫힙니다..." _
            exit 1
          fi
          chmod +x "$app"
          exec "./$app"
          LAUNCHER
          chmod +x "$name/실행.command"

          # 클릭만 하는 사용자를 위한 3줄 안내
          cat > "$name/읽어주세요.txt" <<'READ_ME'
          1. 이 폴더 안의  실행.command  를 더블클릭하세요.
          2. "확인되지 않은 개발자" 라며 막히면,
             시스템 설정 > 개인정보 보호 및 보안 으로 가서
             맨 아래 "확인 없이 열기" 를 누른 뒤 다시 더블클릭하세요.
             (처음 한 번만 하면 됩니다)
          3. 브라우저가 자동으로 열립니다.
             종료하려면 같이 열린 터미널 창에서 Control + C.
          READ_ME

          # 웹에서 받은 파일은 실행 권한이 날아가므로 tar 로 감싼다
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$name" >> "$GITHUB_ENV"
          file "$name/$name"
          lipo -archs "$name/$name"
          tar -tzvf "$name.tar.gz"

      - name: 아티팩트 업로드 (수동 실행용)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET }}

      - name: Release 에 첨부 (태그 푸시일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
