name: Build Windows EXE

# 이 저장소는 비공개입니다. 빌드한 exe 는 공개 배포 저장소의 Release 로 보냅니다.
# (비공개 저장소의 Release 자산은 권한 있는 사람만 받을 수 있기 때문입니다.)
#
# 필요한 시크릿:
#   DIST_RELEASE_TOKEN  배포 저장소에 contents:write 권한이 있는 fine-grained PAT
#
# v 태그를 푸시하면 Windows 러너에서 exe 를 빌드해 Release 에 첨부합니다.
#   git tag v2.0.1 && git push origin v2.0.1
# 수동 실행(Actions 탭 > Run workflow)도 가능하며, 이때는 Release 없이 아티팩트만 남습니다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read    # Release 는 배포 저장소에 올리므로 여기 쓰기 권한은 필요 없다

env:
  DIST_REPO: ohjn96/train-reservation

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      # Windows 콘솔 기본 인코딩(cp949/cp1252)에서 한글·이모지 출력이 죽지 않도록
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: VERSION 과 태그 일치 확인
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $version) {
              throw "태그($tag) 와 VERSION 파일($version) 이 다릅니다. VERSION 을 먼저 올려주세요."
            }
          }

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: 빌드
        run: python build/build.py unified

      - name: 실행 스모크 테스트 (exe 가 실제로 뜨는지)
        shell: pwsh
        env:
          NO_BROWSER: '1'   # 러너에서 브라우저 띄우지 않기
        run: |
          $exe = ".\TrainReservationApp-v$env:VERSION.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          # /license?manage=1 은 라이선스 검사가 켜졌든 꺼졌든 항상 200 이라
          # 정책 상태에 흔들리지 않는 기동 확인 지점이다.
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $res = Invoke-WebRequest "http://localhost:5050/license?manage=1" -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "exe 가 60초 안에 응답하지 않았습니다." }
          Write-Host "OK: exe 정상 기동 확인"

      - name: 아티팩트 업로드 (수동 실행용)
        uses: actions/upload-artifact@v7
        with:
          name: TrainReservationApp-v${{ env.VERSION }}
          path: TrainReservationApp-v${{ env.VERSION }}.exe

      - name: 배포 저장소의 Release 에 올리기 (태그 푸시일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_RELEASE_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: TrainReservationApp-v${{ env.VERSION }}.exe
          # 다른 저장소라 커밋 이력이 없다. 자동 릴리스 노트는 쓸 수 없다.
          generate_release_notes: false
          body: |
            ## 받기

            아래 `TrainReservationApp-v${{ env.VERSION }}.exe` 를 받아 더블클릭하세요.
            Python 설치가 필요 없고 브라우저가 자동으로 열립니다.

            라이선스가 필요하면 앱의 **[라이선스 요청하기]** 버튼을 누르세요.
            자세한 내용은 [README](https://github.com/${{ env.DIST_REPO }}#라이선스-받기) 참조.
          # 2.4.0-rc.0 처럼 하이픈이 붙은 버전은 프리릴리스로 표시한다
          prerelease: ${{ contains(env.VERSION, '-') }}
