name: 라이선스 자동 갱신

# licenses/autorenew.json 에 켜둔 머신 중 만료가 3일 미만 남은 것을 알아서 재발급한다.
# 자동 갱신 대상이 아닌 것은 license-expiry.yml 이 이슈로 알린다.
#
# 켜는 법:
#   이슈에 "/autorenew 30" 댓글, 또는
#   python scripts/license_admin.py autorenew --machine-id A1B2-... --days 30
on:
  schedule:
    - cron: '30 23 * * *'   # 매일 08:30 KST — 만료 알림(09:00)보다 먼저 돈다
  workflow_dispatch:
    inputs:
      within:
        description: '남은 일수 기준'
        default: '3'

permissions:
  contents: read     # 산출물은 배포 저장소에 쓴다

env:
  DIST_REPO: ohjn96/train-reservation
  LICENSE_DIST_DIR: dist

concurrency:
  group: license-write     # 승인 워크플로와 푸시가 겹치지 않게
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 배포 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_RELEASE_TOKEN }}
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet pycryptodome==3.20.0

      - name: 갱신 대상 찾기
        id: scan
        env:
          WITHIN: ${{ github.event.inputs.within || '3' }}
        run: |
          python scripts/ci_renew.py --within "$WITHIN" --out renew.json
          echo "count=$(jq 'length' renew.json)" >> "$GITHUB_OUTPUT"

      - name: 서명 개인키 준비
        if: steps.scan.outputs.count != '0'
        env:
          SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::LICENSE_SIGNING_KEY 시크릿이 없어 자동 갱신을 할 수 없습니다."
            exit 1
          fi
          mkdir -p "$HOME/.config/private_train"
          printf '%s\n' "$SIGNING_KEY" > "$HOME/.config/private_train/license_signing_key.pem"
          chmod 600 "$HOME/.config/private_train/license_signing_key.pem"

      - name: 재발급
        if: steps.scan.outputs.count != '0'
        run: |
          count=$(jq 'length' renew.json)
          for i in $(seq 0 $((count - 1))); do
            MACHINE_ID=$(jq -r ".[$i].machine_id" renew.json)
            DAYS=$(jq -r ".[$i].days" renew.json)
            NAME=$(jq -r ".[$i].name" renew.json)
            python scripts/license_admin.py issue \
              --machine-id "$MACHINE_ID" \
              --days "$DAYS" \
              --name "$NAME" \
              --note "autorenew" \
              --publish
            echo "갱신: $MACHINE_ID (+${DAYS}일)"
          done

      - name: 커밋 & 푸시
        if: steps.scan.outputs.count != '0'
        working-directory: dist
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -d licenses ]; then git add licenses; fi
          if git diff --cached --quiet; then
            echo "바뀐 게 없습니다."
            exit 0
          fi
          COUNT=$(jq 'length' renew.json)
          git commit -m "chore(license): 자동 갱신 ${COUNT}건"
          git push || (git pull --rebase && git push)

      - name: 요약
        run: |
          COUNT=$(jq 'length' renew.json)
          if [ "$COUNT" = "0" ]; then
            echo "갱신할 라이선스가 없습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 자동 갱신 ${COUNT}건" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "- `\(.machine_id)` \(.name) → +\(.days)일"' renew.json \
              >> "$GITHUB_STEP_SUMMARY"
          fi
