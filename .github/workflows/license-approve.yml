name: 라이선스 승인

# 라이선스 요청 이슈에 저장소 주인이 명령 댓글을 달면 실행된다.
# 알림 메일에 그대로 답장해도 이슈 댓글로 들어오므로, 메일 답장만으로 승인할 수 있다.
#
#   /approve         30일 발급 (기본)
#   /approve 90      90일 발급
#   /revoke          이 PC 의 라이선스 차단
#   /deny            거절하고 닫기
#
# issue_comment 워크플로는 항상 기본 브랜치의 파일로 실행되므로,
# 외부인이 PR 로 이 파일을 바꿔치기해 Secrets 를 빼갈 수는 없다.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write   # licenses/ 커밋
  issues: write     # 댓글/닫기

# 여러 승인이 동시에 push 하다 충돌하지 않도록 한 번에 하나씩
concurrency:
  group: license-approve
  cancel-in-progress: false

jobs:
  approve:
    # 이슈(PR 아님) + 저장소 주인 + 명령으로 시작하는 댓글일 때만
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/approve') ||
       startsWith(github.event.comment.body, '/deny') ||
       startsWith(github.event.comment.body, '/revoke'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet pycryptodome==3.20.0

      - name: 명령 해석
        id: parse
        env:
          # 남이 쓴 문자열이므로 환경변수로만 넘기고, 셸에 직접 끼워넣지 않는다
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/ci_approve.py

      - name: 머신 ID 를 못 찾았을 때
        if: steps.parse.outputs.action == 'error'
        # 남이 쓴 값은 전부 환경변수로만 넘긴다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.parse.outputs.message }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"

      - name: 서명 개인키 준비
        if: steps.parse.outputs.action == 'approve' || steps.parse.outputs.action == 'revoke'
        env:
          SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::LICENSE_SIGNING_KEY 시크릿이 설정되어 있지 않습니다."
            exit 1
          fi
          mkdir -p "$HOME/.config/private_train"
          printf '%s\n' "$SIGNING_KEY" > "$HOME/.config/private_train/license_signing_key.pem"
          chmod 600 "$HOME/.config/private_train/license_signing_key.pem"

      - name: 라이선스 발급
        if: steps.parse.outputs.action == 'approve'
        env:
          MACHINE_ID: ${{ steps.parse.outputs.machine_id }}
          DAYS: ${{ steps.parse.outputs.days }}
          REQUESTER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python scripts/license_admin.py issue \
            --machine-id "$MACHINE_ID" \
            --days "$DAYS" \
            --name "$REQUESTER" \
            --note "issue#$ISSUE_NUMBER" \
            --publish

      - name: 라이선스 철회
        if: steps.parse.outputs.action == 'revoke'
        env:
          MACHINE_ID: ${{ steps.parse.outputs.machine_id }}
        run: |
          python scripts/license_admin.py revoke --machine-id "$MACHINE_ID"
          python scripts/license_admin.py unpublish --machine-id "$MACHINE_ID" || true

      - name: 커밋 & 푸시
        if: steps.parse.outputs.action == 'approve' || steps.parse.outputs.action == 'revoke'
        env:
          MACHINE_ID: ${{ steps.parse.outputs.machine_id }}
          ACTION: ${{ steps.parse.outputs.action }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 한 번에 주면 둘 중 하나만 없어도 git 이 통째로 실패하므로 따로 준다
          if [ -d licenses ];     then git add licenses;     fi
          if [ -f revoked.json ]; then git add revoked.json; fi
          if git diff --cached --quiet; then
            echo "바뀐 게 없습니다."
            exit 0
          fi
          git commit -m "chore(license): $ACTION $MACHINE_ID"
          # 동시에 다른 승인이 푸시했을 수 있으니 한 번 rebase 재시도
          git push || (git pull --rebase && git push)

      - name: 승인 결과 알리기
        if: steps.parse.outputs.action == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MACHINE_ID: ${{ steps.parse.outputs.machine_id }}
          DAYS: ${{ steps.parse.outputs.days }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "승인되었습니다. (머신 \`$MACHINE_ID\`, $DAYS일)

          앱의 **라이선스 화면을 켜두면 자동으로 활성화**됩니다.
          GitHub CDN 캐시 때문에 최대 5분쯤 걸릴 수 있습니다.
          화면을 닫았다면 앱을 다시 실행한 뒤 [지금 확인하기] 를 누르세요.

          이 라이선스는 위 머신에서만 동작하며, 다른 PC 로 옮겨 쓸 수 없습니다."
          gh issue close "$ISSUE_NUMBER"

      - name: 철회 결과 알리기
        if: steps.parse.outputs.action == 'revoke'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MACHINE_ID: ${{ steps.parse.outputs.machine_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "머신 \`$MACHINE_ID\` 의 라이선스를 철회했습니다. 반영까지 최대 24시간 걸립니다."
          gh issue close "$ISSUE_NUMBER"

      - name: 거절 처리
        if: steps.parse.outputs.action == 'deny'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "이번 요청은 발급되지 않았습니다."
          gh issue close "$ISSUE_NUMBER" --reason "not planned"
