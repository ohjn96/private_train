name: Build Android App

# v 태그를 푸시하면 APK 를 빌드해 Release 에 첨부합니다 (데스크톱 빌드와 같은 태그).
#   git tag v2.4.0 && git push origin v2.4.0
# 수동 실행(Actions 탭 > Run workflow)도 가능하며, 이때는 아티팩트만 남습니다.
#
# 서명: 저장소 Settings > Secrets > Actions 에 아래 네 개를 넣으면 릴리스 키로 서명합니다.
#   ANDROID_KEYSTORE_BASE64   keystore 파일을 base64 로 인코딩한 값
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# 없으면 디버그 키로 서명합니다. 설치는 되지만 빌드마다 키가 달라서 업데이트할 때
# 기존 앱을 지우고 다시 깔아야 합니다. (키 만드는 법은 mobile/android/README.md)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Release 업로드

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 는 빌드하는 쪽에도 앱과 같은 파이썬(3.12)이 있어야 한다
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v5

      - name: VERSION 과 태그 일치 확인
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "태그(${GITHUB_REF_NAME#v}) 와 VERSION 파일($VERSION) 이 다릅니다." >&2
            exit 1
          fi

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "릴리스 키로 서명합니다."
          else
            echo "::warning::서명 키 시크릿이 없어 디버그 키로 서명합니다. 업데이트 시 앱을 지우고 다시 깔아야 합니다."
          fi

      - name: 빌드
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: 이름 정리
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "dist/TrainReservationApp-v${VERSION}.apk"
          ls -la dist

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v7
        with:
          name: TrainReservationApp-v${{ env.VERSION }}-android
          path: dist/*.apk

      - name: Release 에 첨부
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 데스크톱 빌드가 Release 를 먼저 만들었을 수도, 아닐 수도 있다
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
