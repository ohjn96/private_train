<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}열차 예약{% endblock %}</title>
    <!-- 홈 화면에 추가(PWA): 주소창 없이 앱처럼 열린다 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#EF4444">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="열차예약">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Tailwind CSS CDN (for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ktx: {
                            primary: '#EF4444',
                            secondary: '#DC2626',
                            light: '#FCA5A5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* KTX selected row (red theme) */
        .provider-korail .train-row.selected {
            background-color: #FEE2E2;
            border-left: 4px solid #EF4444;
        }
        /* Fallback */
        .train-row.selected {
            background-color: #FEF3C7;
        }
        .log-container { font-family: 'Consolas', 'Monaco', monospace; }
        /* 폰: 탭할 때 회색 번쩍임 없애기, iOS 가 입력칸을 누를 때 화면을 확대하지 않게(16px 미만이면 확대함) */
        * { -webkit-tap-highlight-color: transparent; }
        @media (max-width: 639px) {
            input, select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body class="h-full bg-gray-50 provider-{{ provider }}">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm border-b">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-14 sm:h-16 justify-between items-center gap-2">
                    <div class="flex items-center space-x-4 min-w-0">
                        <a href="/" class="text-lg sm:text-xl font-bold text-gray-800 whitespace-nowrap">
                            <span class="text-ktx-primary">KTX/SRT</span>
                            예약
                        </a>
                    </div>

                    {% set current_auth = session.get('auth', {}).get(provider, {}) %}
                    {% if current_auth.get('logged_in') %}
                    <div class="flex items-center gap-1 sm:gap-4 min-w-0">
                        <span class="text-xs sm:text-sm text-gray-600 truncate">
                            {{ current_auth.get('user_id', '') }}
                            <span class="hidden sm:inline text-xs text-gray-400">(코레일)</span>
                        </span>

                        <form action="{{ url_for('auth.logout') }}" method="POST">
                            <input type="hidden" name="logout_all" value="true">
                            <button type="submit" data-testid="logout-button"
                                    class="px-2 sm:px-4 py-2 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors whitespace-nowrap">
                                로그아웃
                            </button>
                        </form>
                    </div>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="mx-auto max-w-7xl px-3 sm:px-6 lg:px-8 py-4 sm:py-8">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t mt-auto">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-4">
                <p class="text-center text-sm text-gray-500">
                    열차 예약 시스템 v{{ app_version }} - 개인 학습용
                </p>
                <p class="mt-1 text-center text-sm font-semibold text-red-600">
                    상업용 사용 · 배포 절대 금지
                </p>
            </div>
        </footer>
    </div>

    <!-- Audio for success notification -->
    <audio id="successSound" preload="auto">
        <source src="{{ url_for('static', filename='success_sound.mp3') }}" type="audio/mpeg">
    </audio>

    {% block scripts %}{% endblock %}

    <script>
        // 서비스 워커는 HTTPS(또는 localhost)에서만 등록된다
        if ('serviceWorker' in navigator && window.isSecureContext) {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
        }
    </script>
</body>
</html>
