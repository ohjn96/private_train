<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}열차 예약{% endblock %}</title>
    <!-- Tailwind CSS CDN (for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flatpickr Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ktx: {
                            primary: '#EF4444',
                            secondary: '#DC2626',
                            light: '#FCA5A5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* KTX selected row (red theme) */
        .provider-korail .train-row.selected {
            background-color: #FEE2E2;
            border-left: 4px solid #EF4444;
        }
        /* Fallback */
        .train-row.selected {
            background-color: #FEF3C7;
        }
        .log-container { font-family: 'Consolas', 'Monaco', monospace; }
    </style>
</head>
<body class="h-full bg-gray-50 provider-{{ provider }}">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm border-b">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 justify-between items-center">
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-xl font-bold text-gray-800">
                            <span class="text-ktx-primary">KTX/SRT</span>
                            예약
                        </a>
                    </div>

                    {% set current_auth = session.get('auth', {}).get(provider, {}) %}
                    {% if current_auth.get('logged_in') %}
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-600">
                            {{ current_auth.get('user_id', '') }}
                            <span class="text-xs text-gray-400">(코레일)</span>
                        </span>

                        <form action="{{ url_for('auth.logout') }}" method="POST">
                            <input type="hidden" name="logout_all" value="true">
                            <button type="submit" data-testid="logout-button"
                                    class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
                                로그아웃
                            </button>
                        </form>
                    </div>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t mt-auto">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-4">
                <p class="text-center text-sm text-gray-500">
                    열차 예약 시스템 v{{ app_version }} - 개인 학습용
                </p>
                <p class="mt-1 text-center text-sm font-semibold text-red-600">
                    상업용 사용 절대 금지
                </p>
            </div>
        </footer>
    </div>

    <!-- Audio for success notification -->
    <audio id="successSound" preload="auto">
        <source src="{{ url_for('static', filename='success_sound.mp3') }}" type="audio/mpeg">
    </audio>

    {% block scripts %}{% endblock %}
</body>
</html>
