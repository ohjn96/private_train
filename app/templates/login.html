{% extends "base.html" %}

{% block title %}로그인 - 열차 예약{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold mb-2">
                    <span class="text-ktx-primary">KTX/SRT</span>
                    예약
                </h1>
                <p class="text-gray-500">코레일 계정으로 로그인하세요 (SRT 열차도 함께 조회됩니다)</p>
            </div>



            <!-- Error Message -->
            {% if error %}
            <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-600">{{ error }}</p>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" class="space-y-6">
                <input type="hidden" name="provider" value="{{ provider }}">

                <div>
                    <label for="user_id" class="block text-sm font-medium text-gray-700 mb-2">
                        아이디
                    </label>
                    <input type="text"
                           id="user_id"
                           name="user_id"
                           required
                           placeholder="010-0000-0000 또는 이메일"
                           inputmode="text"
                           autocomplete="username"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2
                                  focus:ring-ktx-primary
                                  focus:border-transparent transition-colors">
                    <p id="user_id_hint" class="mt-1 text-xs text-gray-400 hidden">전화번호: 010-0000-0000 형식</p>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           placeholder="비밀번호를 입력하세요"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2
                                  focus:ring-ktx-primary
                                  focus:border-transparent transition-colors">
                </div>

                <button type="submit"
                        class="w-full py-3 px-4 rounded-lg text-white font-medium transition-colors
                               bg-ktx-primary hover:bg-ktx-secondary">
                    로그인
                </button>
            </form>

            <!-- Help Text -->
            <div class="mt-6 text-center">
                <p class="text-xs text-gray-400">
                    코레일 회원 아이디로 로그인하세요
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const input = document.getElementById('user_id');
    const hint  = document.getElementById('user_id_hint');

    function isPhone(val) {
        // Starts with 010/011/016/017/018/019 or pure digits ≥ 9 chars
        return /^0[1-9][\d\-]*$/.test(val);
    }

    function formatPhone(val) {
        // Strip all non-digits
        const digits = val.replace(/\D/g, '');
        if (digits.length <= 3)  return digits;
        if (digits.length <= 7)  return digits.slice(0, 3) + '-' + digits.slice(3);
        if (digits.length <= 11) return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
        return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7, 11);
    }

    input.addEventListener('input', function (e) {
        const raw = input.value;

        // Only auto-format if it looks like a phone number
        if (isPhone(raw)) {
            const cursor = input.selectionStart;
            const prevLen = raw.length;
            const formatted = formatPhone(raw);
            input.value = formatted;
            // Keep cursor position roughly correct
            const diff = formatted.length - prevLen;
            input.setSelectionRange(cursor + diff, cursor + diff);
            hint.classList.remove('hidden');
        } else {
            hint.classList.add('hidden');
        }
    });

    // On form submit: ensure phone number has dashes (server requires 010-XXXX-XXXX format)
    input.closest('form').addEventListener('submit', function () {
        if (isPhone(input.value)) {
            input.value = formatPhone(input.value);
        }
    });
})();
</script>
{% endblock %}
