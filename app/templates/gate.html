{% extends "base.html" %}

{% block title %}접근 확인 - 열차 예약{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold mb-2">접근 비밀번호</h1>
                <p class="text-gray-500">이 서버 관리자가 알려준 비밀번호를 입력하세요</p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-600">{{ error }}</p>
            </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                <input type="password"
                       name="password"
                       required
                       autofocus
                       autocomplete="current-password"
                       placeholder="접근 비밀번호"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2
                              focus:ring-ktx-primary focus:border-transparent transition-colors">
                <button type="submit"
                        class="w-full py-3 px-4 rounded-lg text-white font-medium transition-colors
                               bg-ktx-primary hover:bg-ktx-secondary">
                    들어가기
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
