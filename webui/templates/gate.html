{% extends "base.html" %}

{% block title %}접근 확인 - 열차 예약{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-10rem)] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="mb-6 px-1">
            <h1 class="text-[26px] font-bold tracking-tight">접근 비밀번호</h1>
            <p class="mt-2 text-sm text-rail-muted">이 서버 관리자가 알려준 비밀번호를 입력하세요.</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3.5 rounded-2xl bg-rail-dangerSoft" role="alert">
            <p class="text-sm text-rail-dangerDark">{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST" class="bg-white border border-rail-line rounded-[20px] p-5 space-y-4">
            <label for="gate_password" class="sr-only">접근 비밀번호</label>
            <input type="password" id="gate_password" name="password" required autofocus
                   autocomplete="current-password" placeholder="접근 비밀번호"
                   class="w-full h-12 px-4 rounded-xl border border-rail-line bg-rail-ground focus:bg-white focus:outline-none focus:border-ktx-primary text-base">
            <button type="submit" class="w-full h-14 rounded-2xl bg-ktx-primary hover:bg-ktx-secondary text-white text-[17px] font-bold transition-colors">
                들어가기
            </button>
        </form>
    </div>
</div>
{% endblock %}
