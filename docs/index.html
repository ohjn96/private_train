<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>라이선스 현황</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { ktx: { primary: '#EF4444', secondary: '#DC2626' } } } } };
</script>
</head>
<body class="h-full bg-gray-50">
<div class="mx-auto max-w-5xl px-4 py-8">

  <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">라이선스 현황</h1>
      <p class="mt-1 text-sm text-gray-500">
        저장소의 <code class="text-xs">licenses/index.json</code> 을 그대로 읽습니다.
      </p>
    </div>
    <button onclick="load()" id="refreshBtn"
            class="px-4 py-2 bg-gray-800 text-white rounded-lg text-sm hover:bg-gray-700">
      새로고침
    </button>
  </header>

  <!-- 검사 ON/OFF -->
  <div id="policyBox" class="mb-6 p-4 rounded-lg border bg-white">
    <p class="text-sm text-gray-400">정책 확인 중...</p>
  </div>

  <!-- 요약 -->
  <div class="mb-6 grid grid-cols-2 sm:grid-cols-4 gap-3">
    <div class="bg-white rounded-lg border p-4">
      <p class="text-xs text-gray-500">전체</p>
      <p id="statTotal" class="mt-1 text-2xl font-bold text-gray-800">–</p>
    </div>
    <div class="bg-white rounded-lg border p-4">
      <p class="text-xs text-gray-500">유효</p>
      <p id="statValid" class="mt-1 text-2xl font-bold text-emerald-600">–</p>
    </div>
    <div class="bg-white rounded-lg border p-4">
      <p class="text-xs text-gray-500">곧 만료</p>
      <p id="statSoon" class="mt-1 text-2xl font-bold text-amber-600">–</p>
    </div>
    <div class="bg-white rounded-lg border p-4">
      <p class="text-xs text-gray-500">만료·철회</p>
      <p id="statDead" class="mt-1 text-2xl font-bold text-gray-400">–</p>
    </div>
  </div>

  <div class="bg-white rounded-lg border overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500">
          <tr>
            <th class="px-4 py-3 text-left font-medium">머신 ID</th>
            <th class="px-4 py-3 text-left font-medium">대상</th>
            <th class="px-4 py-3 text-left font-medium">만료일</th>
            <th class="px-4 py-3 text-right font-medium">남은 기간</th>
            <th class="px-4 py-3 text-left font-medium">상태</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y">
          <tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <p class="mt-4 text-xs text-gray-400">
    이 페이지는 공개 저장소의 파일을 읽으므로 <strong>누구나 볼 수 있습니다.</strong>
    발급·연장·철회는 <a id="issuesLink" href="#" class="underline">Issues</a> 에서
    <code>/approve 30</code> 같은 댓글로 합니다.
  </p>
  <p id="updated" class="mt-1 text-xs text-gray-400"></p>

</div>

<script>
// ---------------------------------------------------------------- 설정
const OWNER  = 'ohjn96';
const REPO   = 'private_train';
const BRANCH = 'release';

const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
document.getElementById('issuesLink').href = `https://github.com/${OWNER}/${REPO}/issues`;

const SOON_DAYS = 7;

// raw 는 CDN 캐시가 있어서, 눌렀을 때 최신을 보려면 캐시를 우회해야 한다
async function getJSON(path) {
    try {
        const res = await fetch(`${RAW}/${path}?t=${Date.now()}`, {cache: 'no-store'});
        if (!res.ok) return null;          // 404 = 아직 그 파일이 없음
        return await res.json();
    } catch (e) {
        return null;
    }
}

function daysLeft(expiresAt) {
    return Math.ceil((expiresAt * 1000 - Date.now()) / 86400000);
}

function fmt(ts) {
    return new Date(ts * 1000).toISOString().slice(0, 10);
}

function badge(text, classes) {
    return `<span class="inline-block px-2 py-0.5 rounded text-xs font-medium ${classes}">${text}</span>`;
}

function renderPolicy(policy) {
    const box = document.getElementById('policyBox');
    const mode = policy ? policy.mode : 'open';
    const views = {
        open: ['bg-gray-50 border-gray-200', 'text-gray-600',
               '라이선스 검사 <strong>꺼짐</strong> — 누구나 앱을 쓸 수 있습니다.'],
        licensed: ['bg-emerald-50 border-emerald-200', 'text-emerald-800',
                   '라이선스 검사 <strong>켜짐</strong> — 허가된 PC 에서만 동작합니다.'],
        blocked: ['bg-red-50 border-red-200', 'text-red-800',
                  '<strong>전면 차단</strong> 중 — 라이선스가 있어도 막힙니다.'],
    };
    const [boxCls, textCls, msg] = views[mode] || views.open;
    box.className = `mb-6 p-4 rounded-lg border ${boxCls}`;
    const seq = policy ? ` <span class="text-xs opacity-60">(seq ${policy.seq})</span>` : '';
    const note = policy && policy.message
        ? `<p class="mt-1 text-sm opacity-80">${policy.message}</p>` : '';
    box.innerHTML = `<p class="text-sm ${textCls}">${msg}${seq}</p>${note}`;
}

function renderRows(licenses, revoked) {
    const tbody = document.getElementById('rows');

    if (!licenses.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">' +
                          '아직 발급된 라이선스가 없습니다.</td></tr>';
        document.getElementById('statTotal').textContent = '0';
        ['statValid', 'statSoon', 'statDead'].forEach(id =>
            document.getElementById(id).textContent = '0');
        return;
    }

    let valid = 0, soon = 0, dead = 0;

    const html = licenses
        .slice()
        .sort((a, b) => a.expires_at - b.expires_at)
        .map(item => {
            const left = daysLeft(item.expires_at);
            const isRevoked = revoked.has(item.license_id) || revoked.has(item.machine_id);

            let status, leftText, rowCls = '';
            if (isRevoked) {
                status = badge('철회됨', 'bg-gray-100 text-gray-500');
                leftText = '–'; dead++; rowCls = 'opacity-50';
            } else if (left <= 0) {
                status = badge('만료', 'bg-gray-100 text-gray-500');
                leftText = '–'; dead++; rowCls = 'opacity-50';
            } else if (left <= SOON_DAYS) {
                status = badge('곧 만료', 'bg-amber-100 text-amber-700');
                leftText = `${left}일`; soon++;
            } else {
                status = badge('유효', 'bg-emerald-100 text-emerald-700');
                leftText = `${left}일`; valid++;
            }

            return `<tr class="${rowCls}">
              <td class="px-4 py-3 font-mono text-xs">${item.machine_id}</td>
              <td class="px-4 py-3">${item.name || '–'}</td>
              <td class="px-4 py-3 text-gray-500">${fmt(item.expires_at)}</td>
              <td class="px-4 py-3 text-right tabular-nums">${leftText}</td>
              <td class="px-4 py-3">${status}</td>
            </tr>`;
        }).join('');

    tbody.innerHTML = html;
    document.getElementById('statTotal').textContent = licenses.length;
    document.getElementById('statValid').textContent = valid;
    document.getElementById('statSoon').textContent = soon;
    document.getElementById('statDead').textContent = dead;
}

async function load() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '불러오는 중...';

    const [index, revocation, policy] = await Promise.all([
        getJSON('licenses/index.json'),
        getJSON('revoked.json'),
        getJSON('license-policy.json'),
    ]);

    renderPolicy(policy);
    renderRows(
        (index && Array.isArray(index.licenses)) ? index.licenses : [],
        new Set((revocation && Array.isArray(revocation.revoked)) ? revocation.revoked : []),
    );

    document.getElementById('updated').textContent =
        '마지막 확인: ' + new Date().toLocaleString('ko-KR');
    btn.disabled = false;
    btn.textContent = '새로고침';
}

load();
</script>
</body>
</html>
