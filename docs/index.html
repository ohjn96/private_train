<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>라이선스 현황</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="wrap">

  <div class="page-head">
    <div>
      <h1>라이선스 현황</h1>
      <p class="sub">저장소의 <code>licenses/index.json</code> 을 그대로 읽습니다.</p>
    </div>
    <button id="refresh" class="btn">새로고침</button>
  </div>

  <div id="policy" class="banner">정책 확인 중...</div>

  <div class="stats">
    <div class="card stat"><div class="label">전체</div>
      <div class="value" id="statTotal">–</div></div>
    <div class="card stat"><div class="label">유효</div>
      <div class="value ok" id="statValid">–</div></div>
    <div class="card stat"><div class="label">곧 만료</div>
      <div class="value warn" id="statSoon">–</div></div>
    <div class="card stat"><div class="label">만료·철회</div>
      <div class="value dead" id="statInactive">–</div></div>
  </div>

  <div class="table-wrap">
    <div class="scroll-x">
      <table>
        <thead>
          <tr>
            <th>머신 ID</th>
            <th>대상</th>
            <th>만료일</th>
            <th class="num">남은 기간</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="5"><div class="empty">불러오는 중...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <p class="note">
    <span id="autoNote"></span><br>
    <span id="updated"></span><br>
    이 페이지는 공개 저장소의 파일을 읽으므로 <strong>누구나 볼 수 있습니다.</strong>
    발급·연장·철회는 Issues 에서 <code>/approve 30</code> 같은 댓글로 합니다.
  </p>

</div>

<script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
