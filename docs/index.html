<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>라이선스 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="wrap">

  <div class="page-head">
    <div>
      <p class="eyebrow">KTX / SRT 예약</p>
      <h1>라이선스 현황</h1>
    </div>
    <button id="refresh" class="btn" type="button">새로고침</button>
  </div>

  <div id="policy" class="policy">정책 확인 중…</div>

  <div class="stats">
    <div class="stat"><span class="k">전체</span><span class="v" id="statTotal">–</span></div>
    <div class="stat"><span class="k">유효</span><span class="v ok" id="statValid">–</span></div>
    <div class="stat"><span class="k">곧 만료</span><span class="v warn" id="statSoon">–</span></div>
    <div class="stat"><span class="k">만료·철회</span><span class="v off" id="statInactive">–</span></div>
  </div>

  <div class="panel roster">
    <table id="rosterTable" hidden>
      <thead>
        <tr>
          <th scope="col">상태</th>
          <th scope="col">머신 ID</th>
          <th scope="col">대상</th>
          <th scope="col">유효기간</th>
          <th scope="col">만료일</th>
          <th scope="col" class="num">남은</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="rosterEmpty"><div class="empty"><p>불러오는 중…</p></div></div>
  </div>

  <p class="foot">
    <span id="autoNote"></span><br>
    공개 저장소의 파일을 읽어 그립니다. <strong>이 페이지는 누구나 볼 수 있습니다.</strong><br>
    발급·연장·철회는 요청함에서 <code>/approve 30</code> 같은 댓글로 합니다.<br>
    <span class="stamp">마지막 확인 <span id="updated">–</span></span>
  </p>

</main>

<script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
